# QASeed look and feel (approved UX palette: navy text, primary blue, soft-blue selection, light canvas).
# No secrets here; secrets.toml in this folder stays gitignored.

[theme]
base = "light"
primaryColor = "#1769AA"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EEF3F8"
textColor = "#102A43"
borderColor = "#DCE4ED"
font = "sans serif"
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"  # hides the developer "Deploy" menu for demos
